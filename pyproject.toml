[project]
name = "churn-case"
version = "0.1.0"
description = "Churn inference and prediction pipeline for the teknisk case dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "catboost>=1.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "joblib>=1.6.0",
    "torch>=2.14.0",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]

[tool.setuptools]
packages = ["src"]
